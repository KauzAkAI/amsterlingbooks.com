<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.M. Sterling | Official Hub</title>
    <style>
        /* 1. MINIMALIST DESIGN: Removing distractions, focusing on content */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow-x: hidden; background: #000; color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 7. PERFORMANCE-DRIVEN: Responsive Video Background */
        #video-background {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: translate(-50%, -50%);
            object-fit: cover; /* Ensures 16:9 aspect ratio fits any screen */
            filter: brightness(0.4); /* 5. ACCESSIBILITY: Ensures text contrast */
        }

        /* 4. MOBILE-FIRST: Thumb-friendly navigation */
        nav {
            display: flex; justify-content: center; padding: 25px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid #00f2ff;
            position: sticky; top: 0; z-index: 100;
        }

        nav a {
            color: #00f2ff; text-decoration: none; margin: 0 20px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 10px #00f2ff; transition: 0.3s ease;
        }

        /* 3. MICRO-INTERACTIONS: Instant feedback on hover */
        nav a:hover { color: #fff; text-shadow: 0 0 20px #00f2ff; transform: scale(1.05); }

        /* 8. SCROLL-BASED STORYTELLING: Hero Layout */
        .hero {
            height: 80vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 6rem); margin: 0;
            letter-spacing: 15px; font-weight: 200;
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; text-shadow: 0 0 20px #00f2ff; }
            50% { opacity: 1; text-shadow: 0 0 50px #00f2ff; }
        }

        /* 12. CONVERSION-FOCUSED CTA */
        .series-tabs {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; padding: 50px; max-width: 1200px; margin: 0 auto;
        }

        .tab-box {
            background: rgba(0, 242, 255, 0.05); border: 1px solid #00f2ff;
            padding: 30px; text-align: center; color: white;
            text-decoration: none; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.4s; backdrop-filter: blur(5px);
        }

        .tab-box:hover { background: rgba(0, 242, 255, 0.2); box-shadow: 0 0 30px #00f2ff; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="video-background" poster="assets/fallback-still.jpg">
        <source src="index_bg.mp4" type="video/mp4">
        <source src="index_bg.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <nav>
        <a href="series.html">The Series</a>
        <a href="shop.html">The Shop</a>
        <a href="archive.html">The Archive</a>
    </nav>

    <div class="hero">
        <h1>A.M. STERLING</h1>
        <p style="letter-spacing: 5px; color: #b0b0b0; margin-top: 20px;">ACQUIRE THE LEGACY</p>
    </div>

    <div class="series-tabs">
        <a href="logic-break.html" class="tab-box">Logic-Break</a>
        <a href="aurora.html" class="tab-box">Aurora Saga</a>
        <a href="minerva.html" class="tab-box">Minerva Core</a>
    </div>

</body>
</html>
