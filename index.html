<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.M. Sterling | Official Hub</title>
    <style>
        /* 2. MINIMALIST DESIGN: Hierarchy & Purpose */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: #fff; font-family: sans-serif;
            overflow-x: hidden;
        }

        /* 7. PERFORMANCE-DRIVEN: 2026 Video Responsive Logic */
        #video-bg {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: -100;
            transform: translate(-50%, -50%);
            object-fit: cover; /* Responsive design: fits mobile/desktop */
            filter: brightness(0.4); /* 5. ACCESSIBILITY: WCAG 2.2 Contrast */
        }

        /* 4. MOBILE-FIRST: Thumb-Friendly Navigation */
        nav {
            display: flex; justify-content: center; padding: 20px;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid #00f2ff; position: sticky; top: 0; z-index: 100;
        }

        nav a {
            color: #00f2ff; text-decoration: none; margin: 0 15px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px #00f2ff; transition: 0.3s;
        }

        /* 3. MICRO-INTERACTIONS: Instant feedback */
        nav a:hover { color: #fff; transform: scale(1.1); }

        .hero {
            height: 90vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 5rem); margin: 0;
            letter-spacing: 10px; font-weight: 200;
            text-shadow: 0 0 20px #00f2ff;
        }

        /* 12. CONVERSION-FOCUSED CTA */
        .cta-box {
            margin-top: 40px; display: flex; gap: 20px;
        }

        .btn {
            border: 1px solid #00f2ff; padding: 15px 30px;
            color: #00f2ff; text-decoration: none; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.4s;
        }

        .btn:hover { background: #00f2ff; color: #000; box-shadow: 0 0 20px #00f2ff; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="video-bg">
        <source src="index_bg.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <nav>
        <a href="shop.html">Shop</a>
        <a href="series.html">Series</a>
        <a href="archive.html">Archive</a>
    </nav>

    <div class="hero">
        <h1>A.M. STERLING</h1>
        <div class="cta-box">
            <a href="shop.html" class="btn">Acquire Data</a>
        </div>
    </div>

</body>
</html>
