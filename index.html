    <title>A.M. Sterling | The Sovereign Collection</title>

        /* 1. ADAPTIVE THEMING & 6. DARK MODE */
        :root {
            --neon-blue: #00f2ff;
            --deep-black: #000000;
            --text-main: #ffffff;
            --accent-gold: #d4af37;
            --transition-speed: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--deep-black); color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* 7. PERFORMANCE-DRIVEN VIDEO BACKGROUND */
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -100; overflow: hidden; background: #000;
        }

        #bg-video {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.4) contrast(1.1); /* 5. ACCESSIBILITY CONTRAST */
            transition: opacity 1.5s ease; opacity: 0; /* Fade in effect */
        }

        /* 3. USER-FIRST NAVIGATION & 4. THUMB-FRIENDLY */
        nav {
            position: fixed; top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; box-sizing: border-box;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            z-index: 1000;
        }

        .brand-logo {
            font-size: 1.5rem; font-weight: 800; letter-spacing: 5px;
            color: var(--neon-blue); text-decoration: none;
            text-shadow: 0 0 15px var(--neon-blue);
        }

        .nav-links { display: flex; gap: 30px; }
        .nav-links a {
            color: white; text-decoration: none; text-transform: uppercase;
            letter-spacing: 2px; font-size: 0.9rem; transition: var(--transition-speed);
        }

        /* 3. MICRO-INTERACTIONS */
        .nav-links a:hover { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); transform: translateY(-2px); }

        /* 8. SCROLL-BASED STORYTELLING HERO */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: clamp(3rem, 12vw, 7rem); margin: 0;
            font-weight: 100; letter-spacing: clamp(10px, 4vw, 35px);
            text-transform: uppercase; line-height: 1;
        }

        /* 12. CONVERSION-FOCUSED CTA */
        .cta-group { margin-top: 50px; display: flex; gap: 20px; flex-wrap: wrap; }
        
        .btn-acquire {
            padding: 20px 50px; background: transparent; border: 1px solid var(--neon-blue);
            color: var(--neon-blue); text-transform: uppercase; letter-spacing: 4px;
            cursor: pointer; transition: var(--transition-speed); text-decoration: none;
        }

        .btn-acquire:hover {
            background: var(--neon-blue); color: black;
            box-shadow: 0 0 40px var(--neon-blue); transform: scale(1.05);
        }

        /* 11. CONTENT-FOCUSED SCANNABLE GRID */
        .series-grid {
            padding: 100px 10%; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 50px; background: rgba(0,0,0,0.9);
        }

        .series-card {
            border: 1px solid rgba(255,255,255,0.1); padding: 40px;
            transition: var(--transition-speed); backdrop-filter: blur(10px);
        }
