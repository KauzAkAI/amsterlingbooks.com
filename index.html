<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.M. Sterling | Official Repository</title>
    <style>
        /* 2. MINIMALIST DESIGN: Clean hierarchy, zero distractions */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* 7. PERFORMANCE-DRIVEN: Full-bleed responsive video container */
        #video-viewport {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: #000;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.4); /* 5. ACCESSIBILITY: Contrast for readability */
        }

        .interface {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; z-index: 10;
        }

        h1 {
            font-family: 'Segoe UI', sans-serif; font-size: 5rem; color: #fff;
            letter-spacing: 20px; text-shadow: 0 0 30px #00f2ff; margin: 0;
        }

        /* 12. CONVERSION-FOCUSED CTA */
        .shop-trigger {
            margin-top: 40px; display: inline-block; padding: 15px 40px;
            border: 1px solid #00f2ff; color: #00f2ff; text-decoration: none;
            letter-spacing: 5px; text-transform: uppercase; transition: 0.5s;
        }

        .shop-trigger:hover { background: #00f2ff; color: #00; box-shadow: 0 0 50px #00f2ff; }
    </style>
</head>
<body>

    <div id="video-viewport">
        <video autoplay muted loop playsinline preload="auto" id="main-video">
            <source src="index_bg.mp4" type="video/mp4">
            Your browser ignores the 2026 protocol.
        </video>
    </div>

    <div class="interface">
        <h1>A.M. STERLING</h1>
        <a href="shop.html" class="shop-trigger">Enter Store</a>
    </div>

    <script>
        // 3. MICRO-INTERACTION: Manual Force-Start
        // This bypasses the "Black Screen" by forcing the play command after DOM load
        window.addEventListener('DOMContentLoaded', (event) => {
            const v = document.getElementById('main-video');
            v.play().catch(error => {
                // 1. AI-POWERED LOGIC: Detects if browser is blocking due to 'autoplay'
                console.log("Protocol blocked by browser settings.");
            });
        });
    </script>
</body>
</html>
