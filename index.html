<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A.M. Sterling | Official Hub</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* THE CINEMATIC VIDEO BACKGROUND */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.6); /* Makes the neon text pop more */
        }

        /* NEON TABS */
        nav {
            display: flex; justify-content: center; padding: 25px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid #00f2ff;
            position: relative; z-index: 100;
        }

        nav a {
            color: #00f2ff; text-decoration: none; margin: 0 30px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 0 15px #00f2ff; transition: 0.5s;
        }

        nav a:hover { color: #fff; text-shadow: 0 0 30px #00f2ff, 0 0 60px #00f2ff; transform: scale(1.1); }

        /* PULSING HERO TEXT */
        .hero {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%;
        }

        h1 {
            font-size: 5.5em; color: white; margin: 0; letter-spacing: 20px;
            animation: glowPulse 4s infinite ease-in-out;
            font-weight: 200;
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 15px #00f2ff, 0 0 30px #00f2ff; opacity: 0.9; }
            50% { text-shadow: 0 0 40px #00f2ff, 0 0 80px #00f2ff; opacity: 1; }
        }

        /* SERIES CARDS */
        .series-tabs {
            position: absolute; bottom: 12%; width: 100%;
            display: flex; justify-content: center; gap: 40px;
        }

        .tab-box {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid #00f2ff; padding: 20px 40px;
            color: white; text-decoration: none; font-weight: bold;
            letter-spacing: 3px; backdrop-filter: blur(5px);
            transition: 0.4s; text-align: center; min-width: 180px;
        }

        .tab-box:hover { 
            background: rgba(0, 242, 255, 0.2); 
            box-shadow: 0 0 40px #00f2ff; 
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="index_bg.mp4" type="video/mp4">
    </video>

    <nav>
        <a href="series.html">The Series</a>
        <a href="author.html">The Author</a>
        <a href="shop.html">The Shop</a>
        <a href="archive.html">The Archive</a>
    </nav>

    <div class="hero">
        <h1>A.M. STERLING</h1>
    </div>

    <div class="series-tabs">
        <a href="logic-break.html" class="tab-box">LOGIC-BREAK</a>
        <a href="aurora.html" class="tab-box">AURORA SAGA</a>
        <a href="minerva.html" class="tab-box">MINERVA CORE</a>
    </div>

</body>
</html>
